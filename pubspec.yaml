name: uae_pass_kit
description: >
  Unofficial UAE Pass Flutter plugin: app-to-app sign-in, profile retrieval,
  document sharing, PDF e-signature, token refresh and logout in pure Dart.
version: 0.0.1
homepage: https://github.com/devamitkumartiwari/uae_pass_kit
repository: https://github.com/devamitkumartiwari/uae_pass_kit
issue_tracker: https://github.com/devamitkumartiwari/uae_pass_kit/issues

environment:
  sdk: '>=3.13.0 <4.0.0'
  flutter: '>=3.29.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  web: '>=1.0.0 <3.0.0'
  plugin_platform_interface: '>=2.0.0 <4.0.0'
  webview_flutter: '>=4.0.0 <6.0.0'
  app_links: '>=6.0.0 <8.0.0'
  http: '>=1.0.0 <2.0.0'
  crypto: '>=2.0.0 <4.0.0'
  url_launcher: '>=6.1.0 <7.0.0'

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: '>=5.0.0 <7.0.0'
  webview_flutter_platform_interface: '>=2.0.0 <3.0.0'
  url_launcher_platform_interface: '>=2.0.0 <3.0.0'

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  plugin:
    platforms:
      android:
        package: com.therivanta.uae_pass_kit
        pluginClass: UaePassKitPlugin
      ios:
        pluginClass: UaePassKitPlugin
      web:
        pluginClass: UaePassKitWeb
        fileName: uae_pass_kit_web.dart

  # To add assets to your plugin package, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg
  #
  # For details regarding assets in packages, see
  # https://flutter.dev/to/asset-from-package
  #
  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # To add custom fonts to your plugin package, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts in packages, see
  # https://flutter.dev/to/font-from-package
