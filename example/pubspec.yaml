name: uae_pass_kit_example
description: "UAE Pass Kit: demo app for the uae_pass_kit plugin."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.11.1

  uae_pass_kit:
    # The example app is bundled with the plugin, so it uses a path
    # dependency on the parent directory. A real app would use:
    #   uae_pass_kit: ^0.0.6
    path: ../

dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

# Launcher icons. The masters and the scripts that draw them are in
# assets/icon/ (kept in git, left out of the published package):
#   swift assets/icon/make_icons.swift "$PWD/assets/icon"   # PNG masters
#   python3 assets/icon/make_vectors.py android/app/src/main/res/drawable
#   dart run flutter_launcher_icons                         # legacy + web
#   sips -z 48 48 assets/icon/icon.png --out web/favicon.png # it writes 16 px
#   python3 assets/icon/finish_icons.py                      # iOS + shrink
#
# - Android 8+ uses the adaptive icon in mipmap-anydpi-v26, whose foreground
#   and themed (monochrome) layers are the vector drawables written by
#   make_vectors.py. flutter_launcher_icons only makes the legacy PNGs used
#   on Android 7.x.
# - iOS uses single-size icons (one 1024 px image each for light, dark and
#   tinted) in ios/Runner/Assets.xcassets/AppIcon.appiconset, and Xcode makes
#   the other sizes. finish_icons.py writes them from the masters.
# - finish_icons.py also stores every icon as a palette PNG when that's
#   pixel-for-pixel identical, which roughly halves their size.
flutter_launcher_icons:
  image_path: assets/icon/icon.png
  android: true
  min_sdk_android: 24
  ios: false
  web:
    generate: true
    image_path: assets/icon/icon.png
    background_color: "#00897B"
    theme_color: "#00897B"
