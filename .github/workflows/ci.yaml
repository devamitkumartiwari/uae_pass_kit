name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  analyze-and-test:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        # Runs against both stable and beta so a breaking Flutter/Dart
        # change is caught here, not by an integrator on a newer channel —
        # this class of bug (Xcode 16, Flutter 3.38/3.44) repeatedly broke
        # flutter_uae_pass with no CI to catch it in advance.
        flutter-channel: [stable, beta]
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ matrix.flutter-channel }}

      - name: Install dependencies
        run: flutter pub get

      - name: Verify formatting
        run: dart format --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze --fatal-infos

      - name: Run tests
        run: flutter test

      - name: Install example dependencies
        run: flutter pub get
        working-directory: example

      - name: Analyze example
        run: flutter analyze --fatal-infos
        working-directory: example

      - name: Test example
        run: flutter test
        working-directory: example

      - name: Dry-run publish
        run: flutter pub publish --dry-run
