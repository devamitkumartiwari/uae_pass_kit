name: uae_pass_kit
description: >
  A complete, unofficial Flutter plugin for UAE Pass: app-to-app sign-in,
  full profile retrieval, document sharing (proof of presentation), PDF
  e-signature, token refresh and logout, built in pure Dart with no vendored
  native binaries.
version: 0.0.1
homepage: https://github.com/uae-pass-kit/uae_pass_kit
repository: https://github.com/uae-pass-kit/uae_pass_kit
issue_tracker: https://github.com/uae-pass-kit/uae_pass_kit/issues

environment:
  sdk: '>=3.13.0 <4.0.0'
  flutter: '>=3.29.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  web: ^1.0.0
  plugin_platform_interface: ^2.0.2
  webview_flutter: ^4.10.0
  app_links: ^6.3.3
  http: ^1.2.2
  crypto: ^3.0.6
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.4
  webview_flutter_platform_interface: ^2.10.0
  url_launcher_platform_interface: ^2.3.2

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  plugin:
    platforms:
      android:
        package: com.uaepasskit.uae_pass_kit
        pluginClass: UaePassKitPlugin
      ios:
        pluginClass: UaePassKitPlugin
      web:
        pluginClass: UaePassKitWeb
        fileName: uae_pass_kit_web.dart

  # To add assets to your plugin package, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg
  #
  # For details regarding assets in packages, see
  # https://flutter.dev/to/asset-from-package
  #
  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # To add custom fonts to your plugin package, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts in packages, see
  # https://flutter.dev/to/font-from-package
