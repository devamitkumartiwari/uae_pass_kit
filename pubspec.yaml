name: uae_pass_kit
description: >
  Unofficial UAE Pass plugin: native app-to-app sign-in, profile retrieval,
  document sharing, e-signature, token refresh and logout for Android/iOS.
version: 0.0.6
homepage: https://github.com/devamitkumartiwari/uae_pass_kit
repository: https://github.com/devamitkumartiwari/uae_pass_kit
issue_tracker: https://github.com/devamitkumartiwari/uae_pass_kit/issues
topics:
  - uae-pass
  - authentication
  - oauth
  - e-signature

environment:
  sdk: ^3.14.0
  flutter: '>=3.50.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  plugin_platform_interface: ^2.1.8
  http: ^1.6.0
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  material_ui: ^1.11.1

flutter:
  plugin:
    platforms:
      android:
        package: com.therivanta.uae_pass_kit
        pluginClass: UaePassKitPlugin
      ios:
        pluginClass: UaePassKitPlugin
      web:
        pluginClass: UaePassKitWeb
        fileName: uae_pass_kit_web.dart
